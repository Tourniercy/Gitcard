[package]
name = "gitcard-p0"
version = "0.1.0"
edition = "2021"
description = "P0 gitcard-api : primitives numériques JS + tables Intl + octicons + parité corpus golden"

[dependencies]
# `float_roundtrip` : parsing décimal → f64 correctement arrondi (Eisel-Lemire),
# aligné sur JSON.parse de V8. Sans elle, serde_json peut errer d'1 ULP sur des
# décimaux longs (constaté sur 1.1471975511965977 — oracle arc-extract.json).
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
md-5 = "0.10"
# P3 : client GitHub GraphQL — TLS par rustls/ring (RULES-RUST), pas d'openssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# P4 : HTTP serveur (axum/hyper 1) + cache L1 TTL par entrée (moka) +
# validation `z.string().url()` des env REDIS_URL/SENTRY_DSN (zod v4 =
# `URL.canParse` WHATWG → crate `url`, cf. src/config.rs).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
moka = { version = "0.12", default-features = false, features = ["future"] }
url = "2"

[dev-dependencies]
# serveur HTTP de test lié sur 127.0.0.1 (valable sous --network none).
wiremock = "0.6"
